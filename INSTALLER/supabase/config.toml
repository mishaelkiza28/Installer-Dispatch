# Applies when you deploy with the Supabase CLI (`supabase functions deploy`).
#
# Both functions check who's calling themselves, so the platform's JWT gate
# is switched off:
#
# - work-order-action: called from the console with a real login, but the
#   gateway's JWT check would also block the browser's CORS preflight
#   (preflights never carry an Authorization header). The function verifies
#   the session and the dispatchers list itself.
#
# - installer-action: called from the installer's job page, which has no
#   login at all. The secret token in the email link is the credential.
[functions.work-order-action]
verify_jwt = false

[functions.installer-action]
verify_jwt = false
